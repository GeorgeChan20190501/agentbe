spring.application.name=ai-start

# AI模型配置
ai.model.provider=qwen

# Spring AI DashScope (通义千问) 配置
# 敏感配置项：必须通过环境变量或IDEA Run Configuration设置
# 开发环境请在IDEA的Run/Debug Configurations中配置Environment variables:
spring.ai.dashscope.api-key=${DASHSCOPE_API_KEY}
spring.ai.dashscope.chat.options.model=Qwen-3.7-Max

# 数据库配置
spring.datasource.url=jdbc:mysql://122.51.82.232:3306/dam?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL日志输出
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE

